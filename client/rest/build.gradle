plugins {
    id 'org.asciidoctor.jvm.convert'
    id 'com.epages.restdocs-api-spec'
}

dependencies {

    implementation project(":security")
    implementation project(":usecase")

    // 도메인 의존성 추가
    rootProject.addDomainDependencies(project)

    implementation("org.springframework:spring-tx")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework:spring-aop")
    implementation("jakarta.validation:jakarta.validation-api")

    implementation("org.mapstruct:mapstruct:1.6.3")
    annotationProcessor("org.mapstruct:mapstruct-processor:1.6.3")

    asciidoctorExt("org.springframework.restdocs:spring-restdocs-asciidoctor")
    testImplementation("org.springframework.restdocs:spring-restdocs-mockmvc")
    testImplementation("com.epages:restdocs-api-spec-mockmvc:${epagesRestdocsApiSpec}")

    testImplementation project(':bootstrap')
}


processResources {
    if (project.findProperty('profile') == 'prod') {
        exclude 'static/swagger/**'
    }
}

// Gradle 프로젝트 전역에서 사용할 변수를 설정합니다.
ext {
    // Spring REST Docs 테스트 실행 시 API 스니펫이 생성될 디렉터리를 지정합니다.
    set('snippetsDir', file("build/generated-snippets"))
}

// 'test' 태스크에 대한 설정을 정의합니다.
tasks.named('test') {
    // 'test' 태스크 실행 후 snippetsDir에 결과물이 생성됨을 명시합니다.
    outputs.dir snippetsDir

    finalizedBy('copyOasToSwagger')
}

// 'asciidoctor' 태스크에 대한 설정을 정의합니다.
tasks.named('asciidoctor') {
    // 'test' 태스크가 완료된 후에 실행되도록 의존성을 설정합니다.
    dependsOn test

    // 'asciidoctor'가 test 스니펫을 사용하므로, 입력 디렉터리로 지정합니다.
    inputs.dir snippetsDir
    // 위에서 정의한 asciidoctorExt 의존성 그룹을 사용합니다.
    configurations 'asciidoctorExt'
}

// 1. 'Copy' 타입의 새로운 태스크 'copyAsciidoc'을 등록합니다.
//    Asciidoctor가 생성한 HTML 문서를 정적 리소스 폴더로 복사하는 역할을 합니다.
tasks.register('copyAsciidoc', Copy) {
    // 'asciidoctor' 태스크가 먼저 실행되어야 HTML 파일이 존재하므로 의존성을 설정합니다.
    dependsOn tasks.named('asciidoctor')

    // Asciidoctor가 생성한 HTML 파일이 위치한 디렉터리를 복사 소스로 지정합니다.
    from "${tasks.named('asciidoctor').get().outputDir}/html5"
    // 복사된 파일을 저장할 목적지 디렉터리를 지정합니다.
    into 'src/main/resources/static/docs'
}

// 'openapi3' 태스크 실행 후 생성된 YAML 파일을 Swagger UI 폴더로 복사하는 태스크입니다.
tasks.register('copyOasToSwagger', Copy) {
    // 복사하기 전, 기존에 존재할 수 있는 파일을 삭제합니다.
    delete 'src/main/resources/static/swagger/swagger-ui/openapi3.yaml'
    // 'openapi3' 태스크가 생성한 YAML 파일의 위치를 소스로 지정합니다.
    from layout.buildDirectory.file("api-spec/openapi3.yaml")
    // 복사할 위치를 지정합니다.
    into 'src/main/resources/static/swagger/swagger-ui/.'
    // 'openapi3' 태스크가 먼저 실행되어야 YAML 파일이 생성되므로 의존성을 설정합니다.
    dependsOn 'openapi3'
}

openapi3 {
    servers = [
            { url = 'http://localhost:8080' }
    ]
    title = '메이플 파티'
    description = '메이플 파티 서버 API 목록'
    version = '0.1.0'
    format = 'yaml'
}