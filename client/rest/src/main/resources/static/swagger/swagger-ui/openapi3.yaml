openapi: 3.0.1
info:
  title: Side Project API
  description: "\n## 메이플 파티 백엔드 API 문서\n\n### 📋 주요 기능\n- 파티 모집글 관리\n- 이력서 관리  \n\
    - 파티 지원서 관리\n- 공지사항 관리\n\n### 🔐 인증\nJWT 토큰을 사용한 인증이 필요합니다.\n"
  version: 1.0.0
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/sign/in:
    post:
      tags:
      - 인증
      summary: 사용자 로그인
      description: 사용자 ID와 비밀번호로 로그인합니다.
      operationId: 로그인
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/로그인 요청"
            examples:
              로그인:
                value: |-
                  {
                    "userId" : "system",
                    "password" : "gmlwls@9833"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                로그인:
                  value: |-
                    {
                      "csrfToken" : "eyJ0eXAiOiJqd3QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbl90eXBlIjoiQ1NSRiIsInN1YiI6InN5c3RlbSIsImlhdCI6MTc1MTc4NjY5NiwiZXhwIjoxNzU0Mzc4Njk2fQ.tyw_iw7fj0kML1aoGhJIv3-WWFQ7GECpB1YQN2sh3jM",
                      "refreshToken" : "eyJ0eXAiOiJqd3QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbl90eXBlIjoiUkVGUkVTSCIsInN1YiI6InN5c3RlbSIsImlhdCI6MTc1MTc4NjY5NiwiZXhwIjoxNzU0Mzc4Njk2fQ.9p_QVEeE_CtI_bvSTzETHGvT6Uf-R-_r0SFfxuEGrLg"
                    }
  /v1/notice:
    post:
      tags:
      - 공지사항 정보
      summary: 공지사항 등록 실패 - 내용 길이 초과
      description: 내용이 255자를 초과한 경우 400 Bad Request를 반환합니다.
      operationId: 공지사항 등록하기
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/공지사항 등록 요청 - 내용 길이 초과"
            examples:
              공지사항 등록하기 - 내용 길이 초과:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : "공지사항 제목",
                      "contents" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    }
                  }
              공지사항 등록하기 - 제목 길이 초과:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                      "contents" : "공지사항 내용입니다."
                    }
                  }
              공지사항 등록하기 - 제목 내용 누락:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : null,
                      "contents" : null
                    }
                  }
              공지사항 등록하기:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : "공지사항 제목",
                      "contents" : "공지사항 내용입니다."
                    }
                  }
              공지사항 등록하기 - 게시글 정보 누락:
                value: |-
                  {
                    "id" : null,
                    "article" : null
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                공지사항 등록하기 - 내용 길이 초과:
                  value: |-
                    {
                      "message" : "내용은 1-255자 사이여야 합니다"
                    }
                공지사항 등록하기 - 제목 길이 초과:
                  value: |-
                    {
                      "message" : "제목은 1-100자 사이여야 합니다"
                    }
                공지사항 등록하기 - 제목 내용 누락:
                  value: |-
                    {
                      "message" : "내용은 필수입니다,제목은 필수입니다"
                    }
                공지사항 등록하기 - 게시글 정보 누락:
                  value: |-
                    {
                      "message" : "게시글 정보는 필수입니다"
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                공지사항 등록하기:
                  value: 게시글을 성공적으로 작성했습니다
  /v1/party:
    get:
      tags:
      - 게시글 정보
      summary: 여러 조건으로 활성 모집글 검색
      description: 제목과 내용에서 키워드를 검색하여 활성 모집글을 조회합니다.
      operationId: '활성 모집글 조회 - '
      parameters:
      - name: searchConditions
        in: query
        description: "검색 조건 (ALL, TITLE, CONTENTS)"
        required: false
        schema:
          type: string
      - name: searchKeyword
        in: query
        description: 검색 키워드
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                활성 모집글 조회 - 복합 검색:
                  value: "[ ]"
                활성 모집글 조회 - 제목 검색:
                  value: "[ ]"
                활성 모집글 조회 - 성공:
                  value: "[ ]"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                활성 모집글 조회 - 키워드 길이 초과:
                  value: |-
                    {
                      "message" : "검색 키워드는 1-100자 사이여야 합니다"
                    }
                활성 모집글 조회 - 검색 조건 누락:
                  value: |-
                    {
                      "message" : "검색 조건은 최소 1개 이상 선택해야 합니다"
                    }
                활성 모집글 조회 - 빈 키워드:
                  value: |-
                    {
                      "message" : "검색 키워드는 1-100자 사이여야 합니다"
                    }
    post:
      tags:
      - 게시글 정보
      summary: 파티 모집글 등록 실패 - 제목/내용 누락
      description: 게시글 제목이나 내용이 누락된 경우 400 Bad Request를 반환합니다.
      operationId: 게시글 등록하기
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/게시글 등록 요청 - 제목 내용 누락"
            examples:
              게시글 등록하기 - 제목 내용 누락:
                value: |-
                  {
                    "id" : 798548639755633328,
                    "userUniqueId" : null,
                    "article" : {
                      "title" : null,
                      "contents" : null
                    },
                    "maxMembers" : -4263777,
                    "status" : "YES"
                  }
              게시글 등록하기 - 게시글 정보 누락:
                value: |-
                  {
                    "id" : 26934,
                    "userUniqueId" : -31,
                    "article" : null,
                    "maxMembers" : -54739,
                    "status" : "YES"
                  }
              게시글 등록하기 - 최대 인원 누락:
                value: |-
                  {
                    "id" : -7986357,
                    "userUniqueId" : -223,
                    "article" : {
                      "title" : "챍㴃쌋痬㳝㤴殾﹦呆ꍞ蹸싆貋々나昴㦫瀩쨆踨芅ᘗჶ笮",
                      "contents" : "ꔓ캭䵁矈혌绡옰솴达͙越嗷띦១อ龀쬙笑쉠㟫࠷甛끩"
                    },
                    "maxMembers" : null,
                    "status" : "YES"
                  }
              게시글 등록하기:
                value: |-
                  {
                    "id" : null,
                    "userUniqueId" : null,
                    "article" : {
                      "title" : "test",
                      "contents" : "testBody"
                    },
                    "maxMembers" : 2,
                    "status" : null
                  }
              게시글 등록하기 - 최대 인원 범위 초과:
                value: |-
                  {
                    "id" : -4364,
                    "userUniqueId" : -2673,
                    "article" : {
                      "title" : "鎫鏂꾆맟肌儷汴촱ㄓ⼓堼蛄㕒⡝줙퀊緀봽꜖ᙻ阽긖ർ㗊ਯﶹ桕ﭶ럖䂐歗",
                      "contents" : "ல"
                    },
                    "maxMembers" : 10,
                    "status" : "DELETE"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                게시글 등록하기 - 제목 내용 누락:
                  value: |-
                    {
                      "message" : "제목은 필수입니다,등록 시 status는 null이어야 합니다,내용은 필수입니다,최대 인원은 2명 이상이어야 합니다,Insert 시 id는 null이어야 합니다"
                    }
                게시글 등록하기 - 게시글 정보 누락:
                  value: |-
                    {
                      "message" : "게시글 정보는 필수입니다,Insert 시 id는 null이어야 합니다,등록 시 status는 null이어야 합니다,Insert 시 id는 null이어야 합니다,최대 인원은 2명 이상이어야 합니다"
                    }
                게시글 등록하기 - 최대 인원 누락:
                  value: |-
                    {
                      "message" : "최대 인원은 필수입니다,등록 시 status는 null이어야 합니다,Insert 시 id는 null이어야 합니다,Insert 시 id는 null이어야 합니다"
                    }
                게시글 등록하기 - 최대 인원 범위 초과:
                  value: |-
                    {
                      "message" : "등록 시 status는 null이어야 합니다,최대 인원은 6명 이하여야 합니다,Insert 시 id는 null이어야 합니다,Insert 시 id는 null이어야 합니다"
                    }
        "200":
          description: "200"
  /v1/resume:
    post:
      tags:
      - 이력서 정보
      summary: 이력서를 등록합니다.
      description: 이력서 내용을 전송받아 이력서를 등록합니다.
      operationId: 이력서 등록하기
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/이력서 등록 요청"
            examples:
              이력서 등록하기:
                value: |-
                  {
                    "id" : null,
                    "userUniqueId" : null,
                    "contents" : "안녕하세요. 저는 백엔드 개발자입니다.\n\n- 경력: 5년\n- 주요 기술 스택: Java, Spring Boot, MySQL\n- 프로젝트 경험: 전자상거래 플랫폼 개발\n",
                    "status" : null
                  }
              이력서 등록하기 - 내용 누락:
                value: |-
                  {
                    "id" : null,
                    "userUniqueId" : null,
                    "contents" : null,
                    "status" : null
                  }
              이력서 등록하기 - 내용 길이 초과:
                value: |-
                  {
                    "id" : null,
                    "userUniqueId" : null,
                    "contents" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                    "status" : null
                  }
              이력서 등록하기 - 빈 내용:
                value: |-
                  {
                    "id" : null,
                    "userUniqueId" : null,
                    "contents" : "",
                    "status" : null
                  }
      responses:
        "200":
          description: "200"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                이력서 등록하기 - 내용 누락:
                  value: |-
                    {
                      "message" : "이력서 내용은 필수입니다"
                    }
                이력서 등록하기 - 내용 길이 초과:
                  value: |-
                    {
                      "message" : "이력서 내용은 1-255자 사이여야 합니다"
                    }
                이력서 등록하기 - 빈 내용:
                  value: |-
                    {
                      "message" : "이력서 내용은 1-255자 사이여야 합니다,이력서 내용은 필수입니다"
                    }
  /v1/party/application:
    post:
      tags:
      - 파티 지원서 정보
      summary: 파티 지원서 등록 실패 - 잘못된 값
      description: 잘못된 값이 전송된 경우 400 Bad Request를 반환합니다.
      operationId: 파티 지원서 등록하기
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/파티 지원서 등록 요청 - 잘못된 값"
            examples:
              파티 지원서 등록하기 - 잘못된 값:
                value: |-
                  {
                    "id" : null,
                    "revision" : null,
                    "partyRecruitId" : -1,
                    "resumeId" : 0,
                    "status" : null
                  }
              파티 지원서 등록하기 - 필수 값 누락:
                value: |-
                  {
                    "id" : null,
                    "revision" : null,
                    "partyRecruitId" : null,
                    "resumeId" : null,
                    "status" : null
                  }
              파티 지원서 등록하기:
                value: |-
                  {
                    "id" : null,
                    "revision" : null,
                    "partyRecruitId" : 1,
                    "resumeId" : 1,
                    "status" : null
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                파티 지원서 등록하기 - 잘못된 값:
                  value: |-
                    {
                      "message" : "이력서 ID는 양수여야 합니다,파티 모집글 ID는 양수여야 합니다"
                    }
                파티 지원서 등록하기 - 필수 값 누락:
                  value: |-
                    {
                      "message" : "이력서 ID는 필수입니다,파티 모집글 ID는 필수입니다"
                    }
        "200":
          description: "200"
  /v1/party/{partyRecruitId}:
    get:
      tags:
      - 게시글 정보
      summary: 파티 모집글 조회 실패 - 존재하지 않는 ID
      description: 존재하지 않는 파티 모집글 ID로 조회 시 400 Bad Request를 반환합니다.
      operationId: '파티 모집글 조회 - '
      parameters:
      - name: partyRecruitId
        in: path
        description: 파티 모집글 ID
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party486549215"
              examples:
                파티 모집글 조회 - 존재하지 않는 ID:
                  value: |-
                    {
                      "message" : "존재하지 않는 파티모집글 입니다."
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party-partyRecruitId-1535023103"
              examples:
                파티 모집글 조회 - 성공:
                  value: |-
                    {
                      "id" : 1,
                      "revision" : 0,
                      "userUniqueId" : 1,
                      "article" : {
                        "title" : "\uD83D\uDD25\uD83D\uDD25\uD83D\uDD25 불어전  /불어전 6인 /불어전 6 /불어전6 인팟!!! \uD83D\uDD25\uD83D\uDD25\uD83D\uDD25\uD83D\uDD25\uD83D\uDD25",
                        "contents" : "┏━━━━━━━━━━━━┓ ┏━━━━━━━━━━━━┓\n   \uD83D\uDFE2좌3: 88허밋(140)  \uD83D\uDFE2우3:   87 허밋 (150)\n   \uD83D\uDD34좌3: 구인중(140)   \uD83D\uDFE2우3:  95 시마 (150)\n ┗━━━━━━━━━━━━┛ ┗━━━━━━━━━━━━┛\n      \uD83E\uDDD9‍  132 앜메            \uD83E\uDDD9‍♀️  132비숍 (메용9) 답없구"
                      },
                      "maxMembers" : 2,
                      "status" : "YES",
                      "metadata" : {
                        "createdByName" : "시스템",
                        "createdAt" : 1.751696714E9,
                        "modifiedByName" : null,
                        "modifiedAt" : null,
                        "deletedByName" : null,
                        "deletedAt" : null
                      }
                    }
components:
  schemas:
    v1-party-partyRecruitId-1535023103:
      required:
      - article
      - id
      - maxMembers
      - metadata
      - revision
      - status
      - userUniqueId
      type: object
      properties:
        metadata:
          required:
          - createdAt
          type: object
          properties:
            createdAt:
              type: number
              description: 생성일시 (epoch timestamp)
            createdByName:
              type: string
              description: 생성자 이름
              nullable: true
            deletedAt:
              type: number
              description: 삭제일시 (epoch timestamp)
              nullable: true
            modifiedByName:
              type: string
              description: 수정자 이름
              nullable: true
            deletedByName:
              type: string
              description: 삭제자 이름
              nullable: true
            modifiedAt:
              type: number
              description: 수정일시 (epoch timestamp)
              nullable: true
          description: 메타데이터
        maxMembers:
          type: number
          description: 최대 인원
        userUniqueId:
          type: number
          description: 작성자 고유 ID
        id:
          type: number
          description: 파티 모집글 ID
        article:
          required:
          - contents
          - title
          type: object
          properties:
            contents:
              type: string
              description: 게시글 내용
            title:
              type: string
              description: 게시글 제목
          description: 게시글 정보
        status:
          type: string
          description: 상태
        revision:
          type: number
          description: 버전
    공지사항 등록 요청 - 내용 길이 초과:
      title: 공지사항 등록 요청 - 내용 길이 초과
      required:
      - article
      type: object
      properties:
        article:
          required:
          - contents
          - title
          type: object
          properties:
            contents:
              type: string
              description: 공지사항 내용
            title:
              type: string
              description: 공지사항 제목
          description: 게시글 정보
    로그인 요청:
      title: 로그인 요청
      required:
      - password
      - userId
      type: object
      properties:
        password:
          type: string
          description: 비밀번호
        userId:
          type: string
