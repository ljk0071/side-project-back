openapi: 3.0.1
info:
  title: Side Project API
  description: "\n## 메이플 파티 백엔드 API 문서\n\n### 📋 주요 기능\n- 파티 모집글 관리\n- 이력서 관리  \n\
    - 파티 지원서 관리\n- 공지사항 관리\n\n### 🔐 인증\nJWT 토큰을 사용한 인증이 필요합니다.\n"
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags: [ ]
paths:
  /api/sign/in:
    post:
      tags:
        - 인증
      summary: 사용자 로그인
      description: 사용자 ID와 비밀번호로 로그인합니다.
      operationId: 로그인
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/로그인 요청"
            examples:
              로그인:
                value: |-
                  {
                    "password" : "gmlwls@9833",
                    "userId" : "system"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/v1-party-application-177-ACCEPTED486549215"
              examples:
                로그인:
                  value: |-
                    {
                      "csrfToken" : "eyJ0eXAiOiJqd3QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbl90eXBlIjoiQ1NSRiIsInN1YiI6InN5c3RlbSIsImlhdCI6MTc1MjEwMzUyMSwiZXhwIjoxNzU0Njk1NTIxfQ.1DGMvdqMes4fWHNrZVodZ5E2nboWAoHgomaIqdcye5A",
                      "refreshToken" : "eyJ0eXAiOiJqd3QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbl90eXBlIjoiUkVGUkVTSCIsInN1YiI6InN5c3RlbSIsImlhdCI6MTc1MjEwMzUyMSwiZXhwIjoxNzU0Njk1NTIxfQ.9vy9j5DH_ZK12w7xwfqQlBoueAT0uE86rukOJijAM1U"
                    }
  /v1/notice:
    post:
      tags:
        - 공지사항 정보
      summary: 공지사항 등록 실패 - 내용 길이 초과
      description: 내용이 255자를 초과한 경우 400 Bad Request를 반환합니다.
      operationId: 공지사항 등록하기
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/공지사항 등록 요청 - 내용 길이 초과"
            examples:
              공지사항 등록하기 - 내용 길이 초과:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : "공지사항 제목",
                      "contents" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    }
                  }
              공지사항 등록하기 - 제목 길이 초과:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                      "contents" : "공지사항 내용입니다."
                    }
                  }
              공지사항 등록하기 - 제목 내용 누락:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : null,
                      "contents" : null
                    }
                  }
              공지사항 등록하기:
                value: |-
                  {
                    "id" : null,
                    "article" : {
                      "title" : "공지사항 제목",
                      "contents" : "공지사항 내용입니다."
                    }
                  }
              공지사항 등록하기 - 게시글 정보 누락:
                value: |-
                  {
                    "id" : null,
                    "article" : null
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party-application-177-ACCEPTED486549215"
              examples:
                공지사항 등록하기 - 내용 길이 초과:
                  value: |-
                    {
                      "message" : "내용은 1-255자 사이여야 합니다"
                    }
                공지사항 등록하기 - 제목 길이 초과:
                  value: |-
                    {
                      "message" : "제목은 1-100자 사이여야 합니다"
                    }
                공지사항 등록하기 - 제목 내용 누락:
                  value: |-
                    {
                      "message" : "제목은 필수입니다,내용은 필수입니다"
                    }
                공지사항 등록하기 - 게시글 정보 누락:
                  value: |-
                    {
                      "message" : "게시글 정보는 필수입니다"
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party-application-177-ACCEPTED486549215"
              examples:
                공지사항 등록하기:
                  value: 게시글을 성공적으로 작성했습니다
  /v1/party:
