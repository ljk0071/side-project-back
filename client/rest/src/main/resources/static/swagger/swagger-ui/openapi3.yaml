                value: |-
                  {
                    "id" : null,
                    "userUniqueId" : null,
                    "contents" : "",
                    "status" : null
                  }
      responses:
        "200":
          description: "200"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party-application-177-ACCEPTED486549215"
              examples:
                이력서 등록하기 - 내용 누락:
