  /v1/party/{partyRecruitId}:
    get:
      tags:
        - 게시글 정보
      summary: 파티 모집글 조회 실패 - 존재하지 않는 ID
      description: 존재하지 않는 파티 모집글 ID로 조회 시 400 Bad Request를 반환합니다.
      operationId: '파티 모집글 조회 - '
      parameters:
        - name: partyRecruitId
          in: path
          description: 파티 모집글 ID
          required: true
          schema:
            type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party-application-177-ACCEPTED486549215"
              examples:
                파티 모집글 조회 - 존재하지 않는 ID:
                  value: |-
                    {
                      "message" : "존재하지 않는 파티모집글 입니다."
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-party-partyRecruitId-1535023103"
              examples:
                파티 모집글 조회 - 성공:
                  value: |-
                    {
                      "id" : 1,
                      "revision" : 0,
                      "userUniqueId" : 1,
