plugins {
    id "java"
    id "io.spring.dependency-management" version "${springDependencyManagementVersion}"
    id "org.springframework.boot" version "${springBootVersion}" apply false
    id 'org.asciidoctor.jvm.convert' version "${asciidoctorConvertVersion}" apply false
    id 'com.epages.restdocs-api-spec' version "${epagesRestdocsApiSpec}" apply false
}

allprojects {
    group = "${projectGroup}"
    version = "${applicationVersion}"
}

subprojects {
    apply plugin: "java"
    apply plugin: "io.spring.dependency-management"

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
    }

    dependencies {
        // Jackson
        implementation("com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}")

        implementation 'org.springframework.boot:spring-boot-starter-log4j2'

        // lombok
        annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

        // annotation processor
        annotationProcessor("org.springframework.boot:spring-boot-configuration-processor:${springBootVersion}")

        testImplementation("org.springframework.boot:spring-boot-starter-test")
    }

    configurations {
        asciidoctorExt
        configureEach {
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
            exclude group: 'ch.qos.logback', module: 'logback-classic'
            exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        }
        compileOnly {
            extendsFrom(annotationProcessor)
        }
    }

    tasks.named("jar") {
        enabled = true
    }

    tasks.named("test") {
        useJUnitPlatform()
    }
}

// 공통 의존성 정의
ext {
    domains = ["board", "external", "memory", "metadata", "user", "util"]
}

// 함수로 정의해서 선택적으로 사용할 수 있게 만들기
ext.addDomainDependencies = { prj ->
    domains.each { domain -> prj.dependencies.implementation prj.project(":domain:${domain}") }
}